name: "Retrain Pipeline — Predictive Maintenance"

# ──────────────────────────────────────────────────────────────────────────────
# Pipeline de reentrenamiento del modelo de mantenimiento predictivo.
#
# Triggers:
#   - schedule: Cada lunes 03:00 UTC (CASO 1 — Cron)
#   - workflow_dispatch: Manual (CASO 4) o disparado por drift_monitor.yml (CASO 2/3)
#
# Pasos:
#   1. Backup del modelo actual (api/models/ → models_backup/v{version}_{ts}/)
#   2. Entrenamiento (Autoencoder + DQN con datos frescos)
#   3. Validación — Model Gate (rechaza si métricas insuficientes)
#   4. Promoción (copia models_new/ → api/models/, actualiza model_metadata.json)
#   5. Rollback automático si el gate falla (restaura el backup del paso 1)
# ──────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: "0 3 * * 1"   # CASO 1: Cada lunes a las 03:00 UTC
  workflow_dispatch:
    inputs:
      trigger_reason:
        description: "Motivo del reentrenamiento"
        required: false
        default: "manual"
      drift_score:
        description: "Drift score (si fue disparado por drift_monitor)"
        required: false
        default: "0"
      drift_reason:
        description: "Razón del drift detectado"
        required: false
        default: ""

env:
  RETRAIN_TRIGGER: ${{ github.event.inputs.trigger_reason || 'scheduled' }}
  PYTHON_VERSION: "3.11"

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: Ejecutar el pipeline de reentrenamiento completo
  # ─────────────────────────────────────────────────────────────
  retrain:
    name: "Reentrenamiento del Modelo"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: "Instalar dependencias de entrenamiento"
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
          pip install pandas scikit-learn

      - name: "Mostrar contexto del reentrenamiento"
        run: |
          echo "## 🔄 Pipeline de Reentrenamiento" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger | ${{ env.RETRAIN_TRIGGER }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Drift Score | ${{ github.event.inputs.drift_score || 'N/A' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Drift Reason | ${{ github.event.inputs.drift_reason || 'N/A' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Timestamp | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY

      # ── PASO 1: Backup ──────────────────────────────────────
      - name: "PASO 1 — Backup del modelo actual"
        run: |
          echo "::group::Backup de modelos"
          python api/retrain_script.py --backup
          echo "::endgroup::"

      # ── PASO 2: Entrenamiento ────────────────────────────────
      - name: "PASO 2 — Reentrenamiento (Autoencoder + DQN)"
        id: train
        run: |
          echo "::group::Entrenamiento"
          # --dry-run entrena y guarda en models_new/ sin tocar api/models/.
          # La promoción ocurre en PASO 4 solo si el gate aprueba.
          # Si el CSV no existe, el script genera datos sintéticos automáticamente.
          python api/retrain_script.py --dry-run --data-path data/ai4i2020.csv
          echo "::endgroup::"

      # ── PASO 3: Validación / Model Gate ─────────────────────
      - name: "PASO 3 — Validación de métricas (Model Gate)"
        id: gate
        run: |
          echo "::group::Model Gate"
          python api/retrain_script.py --validate-only
          echo "::endgroup::"

      # ── PASO 4: Promoción ────────────────────────────────────
      - name: "PASO 4 — Promover modelo a producción"
        run: |
          echo "::group::Promoción"
          python api/retrain_script.py --promote
          echo "::endgroup::"

      - name: "Leer nueva versión del modelo"
        id: new_version
        run: |
          VERSION=$(python -c "import json; print(json.load(open('api/models/model_metadata.json'))['version'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "::notice title=Modelo promovido::Nueva versión: $VERSION"

      # ── PASO 5 (solo si hay fallo): Rollback ─────────────────
      - name: "ROLLBACK — Restaurar modelo anterior (solo si el gate falló)"
        if: failure()
        run: |
          echo "::error title=Model Gate Fallido::El modelo nuevo no superó los criterios de calidad. Ejecutando rollback..."
          python api/retrain_script.py --rollback
          echo "## ❌ Reentrenamiento Fallido — Rollback Ejecutado" >> $GITHUB_STEP_SUMMARY
          echo "El modelo anterior ha sido restaurado desde el backup." >> $GITHUB_STEP_SUMMARY

      - name: "Resumen final del pipeline"
        if: success()
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## ✅ Reentrenamiento Exitoso" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Nueva versión | ${{ steps.new_version.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Gate | ✅ APROBADO |" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger | ${{ env.RETRAIN_TRIGGER }} |" >> $GITHUB_STEP_SUMMARY

      - name: "Subir reporte del gate como artefacto"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-report-${{ github.run_id }}
          path: gate_report.json
          retention-days: 30

  # ─────────────────────────────────────────────────────────────
  # JOB 2: Tests post-reentrenamiento (solo si retrain pasó)
  # ─────────────────────────────────────────────────────────────
  post-retrain-tests:
    name: "Tests Post-Reentrenamiento"
    runs-on: ubuntu-latest
    needs: retrain

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r api/requirements.txt fastapi httpx pytest

      - name: "Verificar que la API arranca con el nuevo modelo"
        run: |
          cd api
          nohup uvicorn main:app --port 8000 &
          sleep 10
          curl -sf http://localhost:8000/health
          curl -sf http://localhost:8000/model/metadata | python -m json.tool
          kill %1 || true

      - name: "Verificar versión del modelo en metadata"
        run: |
          python -c "
          import json
          meta = json.load(open('api/models/model_metadata.json'))
          print(f'Versión en producción: {meta[\"version\"]}')
          print(f'Threshold: {meta[\"threshold\"]}')
          print(f'Último reentrenamiento: {meta[\"retrain_history\"][-1]}')
          "

      - name: "Resumen de tests post-reentrenamiento"
        run: |
          echo "## ✅ API operativa con nuevo modelo" >> $GITHUB_STEP_SUMMARY
