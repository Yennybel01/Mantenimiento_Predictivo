name: CI/CD - Test, Build & Deploy

# CI: se ejecuta en cada push/PR para validar que nada rompe.
# CD: el deploy solo se dispara en push a main/UI y solo si CI pasó.
# TODO: quitar "UI" de esta lista cuando fusionen definitivamente a main.
on:
  push:
    branches: [main, UI]
  pull_request:
    branches: [main, UI]
  workflow_dispatch: {}

jobs:
  # -------------------------------------------------------------------
  # 1) CI: pruebas de humo del backend
  # -------------------------------------------------------------------
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
          pip install pytest httpx

      - name: Run smoke tests
        run: pytest tests/ -v

  # -------------------------------------------------------------------
  # 2) CI: valida que ambas imágenes Docker construyen sin errores
  # -------------------------------------------------------------------
  build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t pm-api:ci ./api

      - name: Build App (Streamlit) image
        run: docker build -t pm-app:ci ./app

  # -------------------------------------------------------------------
  # 3) CD: dispara el redeploy en Render (solo push a main, no en PRs)
  # -------------------------------------------------------------------
  deploy:
    name: Trigger deploy on Render
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/UI')
    steps:
      - name: Deploy pm-api
        run: curl -fsSL -X POST "${{ secrets.RENDER_DEPLOY_HOOK_API }}"

      - name: Deploy pm-app
        run: curl -fsSL -X POST "${{ secrets.RENDER_DEPLOY_HOOK_APP }}"